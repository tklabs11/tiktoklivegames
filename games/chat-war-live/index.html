<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1220" />
  <title>CHAT WAR LIVE</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg-1: #070d18;
      --bg-2: #101a2d;
      --panel: rgba(13, 19, 29, 0.82);
      --panel-strong: rgba(10, 16, 26, 0.96);
      --line: rgba(255,255,255,0.12);
      --text: #ebf5ff;
      --muted: #9bb7d1;
      --accent: #58d0ff;
      --accent-2: #ffd166;
      --danger: #ff5d73;
      --success: #59d38a;
      --shadow: rgba(0,0,0,0.38);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #0f1c2f 0%, var(--bg-1) 40%, #03070d 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    #app {
      position: relative;
      width: min(92vw, 420px);
      height: min(92vh, 760px);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(9,16,26,0.98), rgba(18,26,38,0.96));
      border: 1px solid var(--line);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 30px rgba(88,208,255,0.08);
      overflow: hidden;
    }

    #game-shell {
      position: absolute;
      inset: 0;
      display: none;
      background: #07111c;
    }

    #game-shell.visible {
      display: block;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0c1724, #121f2b);
    }

    #menu {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: radial-gradient(circle at 50% 30%, rgba(88,208,255,0.18), rgba(7,13,24,0.94) 42%);
    }

    .panel {
      width: min(100%, 360px);
      background: rgba(9, 15, 22, 0.86);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px 18px 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.38);
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: clamp(22px, 5vw, 32px);
      letter-spacing: 0.12em;
      color: var(--accent-2);
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0 0 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .field input,
    .field select,
    .field button {
      width: 100%;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      font-size: 15px;
      padding: 0 12px;
    }

    .field select {
      appearance: none;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: linear-gradient(180deg, #1a3857, #10263d);
      border: 1px solid rgba(88,208,255,0.28);
      color: white;
      font-weight: bold;
      letter-spacing: 0.04em;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(88, 208, 255, 0.14);
    }

    .primary {
      background: linear-gradient(180deg, #1e7baf, #0d4d73);
      border-color: rgba(88,208,255,0.28);
    }

    .secondary {
      background: linear-gradient(180deg, #2a2f3f, #1d2330);
      border-color: rgba(255,255,255,0.12);
    }

    #hud {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: auto;
      z-index: 10;
    }

    #hud.visible {
      display: block;
    }

    #topbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }

    .chip {
      background: rgba(9, 18, 30, 0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 7px 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .chip.accent {
      color: var(--accent-2);
    }

    #status {
      position: absolute;
      top: 58px;
      left: 12px;
      padding: 7px 10px;
      background: rgba(9,18,30,0.7);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      pointer-events: none;
    }

    #status.connected {
      color: var(--success);
    }

    #ranking-box {
      position: absolute;
      right: 12px;
      top: 58px;
      width: 160px;
      padding: 8px 10px 10px;
      border-radius: 12px;
      background: rgba(10, 18, 28, 0.78);
      border: 1px solid rgba(255,255,255,0.12);
      pointer-events: none;
    }

    #ranking-box h3 {
      margin: 0 0 8px;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-2);
    }

    #ranking-list {
      display: grid;
      gap: 4px;
      font-size: 11px;
      color: var(--text);
    }

    #notifications {
      position: absolute;
      left: 50%;
      top: 90px;
      transform: translateX(-50%);
      width: min(82%, 310px);
      display: grid;
      gap: 8px;
      justify-items: center;
      pointer-events: none;
    }

    #arena-invite {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      width: min(82%, 300px);
      padding: 16px 18px;
      text-align: center;
      border: 1px solid rgba(88, 208, 255, 0.42);
      border-radius: 16px;
      background: rgba(6, 15, 24, 0.88);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28), inset 0 0 24px rgba(88, 208, 255, 0.08);
      color: var(--text);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    #arena-invite.visible {
      opacity: 1;
      visibility: visible;
    }

    #arena-invite strong {
      display: block;
      margin-bottom: 6px;
      color: var(--accent-2);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #arena-invite span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .notification {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.04em;
      background: rgba(9, 18, 30, 0.82);
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .notification.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #demo-panel {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: 210px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(9, 18, 30, 0.74);
      border: 1px solid rgba(255,255,255,0.12);
      display: none;
      pointer-events: auto;
      z-index: 20;
    }

    #demo-panel.visible {
      display: block;
    }

    #demo-panel h4 {
      margin: 0 0 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-2);
    }

    .demo-actions {
      display: grid;
      gap: 8px;
    }

    .demo-actions button {
      height: 30px;
      font-size: 11px;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="menu">
      <div class="panel">
        <h1>CHAT WAR LIVE</h1>
        <p class="subtitle">Shooter interativo para live</p>

        <div class="field">
          <label for="username">TikTok username</label>
          <input id="username" type="text" value="@seu_usuario" />
        </div>

        <div class="field">
          <label for="mode">Modo</label>
          <select id="mode">
            <option value="live">TikTok Live</option>
            <option value="demo">Demo Mode</option>
          </select>
        </div>

        <div class="field">
          <label for="mapSelect">Mapa</label>
          <select id="mapSelect">
            <option value="urban">Urban Strike</option>
            <option value="industrial">Industrial Base</option>
          </select>
        </div>

        <div class="button-row">
          <button class="primary" id="startBtn">Iniciar</button>
          <button class="secondary" id="demoBtn">Demo</button>
        </div>
      </div>
    </div>

    <div id="game-shell">
      <canvas id="gameCanvas" width="540" height="960"></canvas>
    </div>

    <div id="hud">
      <div id="topbar">
        <div class="chip accent">CHAT WAR LIVE</div>
        <div class="chip" id="roundChip">RODADA 1</div>
      </div>

      <div id="status">● Configurando arena</div>

      <div id="ranking-box">
        <h3>Ranking</h3>
        <div id="ranking-list"></div>
      </div>

      <div id="notifications"></div>

      <div id="arena-invite" aria-live="polite">
        <strong>A arena está esperando</strong>
        <span>Digite qualquer coisa no chat para entrar na batalha.</span>
      </div>

      <div id="demo-panel">
        <h4>Demo Controls</h4>
        <div class="demo-actions">
          <button data-demo="add:TK">+ TK</button>
          <button data-demo="add:JOAO">+ JOAO</button>
          <button data-demo="add:MARIA">+ MARIA</button>
          <button data-demo="add:PEDRO">+ PEDRO</button>
          <button data-demo="add:CARLOS">+ CARLOS</button>
          <button data-demo="gift:Rose">Simular presente</button>
          <button data-demo="chat:salve">Simular chat</button>
          <button data-demo="clear">Limpar arena</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>

;right:18px;display:flex;gap:14px;height:184px}.card{flex:1;border:2px solid var(--accent);border-radius:14px;background:linear-gradient(180deg,var(--tint) 0%,#111923 43%,#080d13 100%);overflow:hidden;box-shadow:0 5px 12px #000a}.card header{height:38px;background:linear-gradient(90deg,var(--accent),transparent);padding:2px 11px;font-size:31px;font-weight:1000}.card .points{text-align:center;font-size:78px;font-weight:1000;line-height:91px;text-shadow:0 3px 9px #0009}.card .pointslabel{text-align:center;letter-spacing:4px;font-size:11px;font-weight:900;color:#e6ebf1}.bar{height:11px;margin:5px 11px 3px;background:#252d35;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:width .35s}.counts{display:flex;justify-content:space-between;margin:0 11px;font-size:12px;font-weight:900}.gift{position:absolute;top:419px;font-size:10px;font-weight:900;padding:4px 7px;border-radius:12px;background:#151a20e6;border:1px solid #b8a66c}.gift.left{left:23px}.gift.right{right:23px}.machines{position:absolute;top:458px;left:8px;right:8px;display:flex;gap:11px;z-index:4}.machine{position:relative;width:calc(50% - 5.5px);height:166px;padding:13px 9px 12px;background:linear-gradient(130deg,#f7f8f7 0%,#d9dedf 42%,#a9b1b5 100%);border:3px solid #9ca5a7;border-bottom:13px solid #6d7376;border-radius:10px 10px 4px 4px;box-shadow:inset 0 2px 5px #fff,0 10px 5px #0006,0 18px 18px #0005;display:flex;gap:7px}.machine:before{content:"SIMULADOR";position:absolute;top:3px;right:14px;color:#606b72;font-size:6px;letter-spacing:1.4px;font-weight:900}.screen{margin-top:7px;width:52%;height:119px;background:linear-gradient(#edf2f2,#d4dddf);border:4px ridge #a2b0b7;box-shadow:inset 0 1px 5px #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1c2831;text-align:center}.screen img{width:48px;height:51px;object-fit:cover;background:#fff}.typed{font-size:30px;line-height:1.1;font-weight:1000;letter-spacing:1px}.status{font-size:8px;font-weight:900;margin-top:3px;min-height:10px}.keys{margin-top:8px;width:48%;height:114px;background:linear-gradient(#2e3338,#15191c);border:3px solid #60666a;border-radius:4px;padding:4px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:3px}.key{min-width:0;min-height:0;border:0;border-radius:2px;color:#fff;background:linear-gradient(#42474b,#202326);box-shadow:0 2px 1px #090c0e;font-weight:900;font-size:11px;padding:0}.key.clear{background:#dc7d12;font-size:8px}.key.white{background:#ddd;color:#141414;font-size:7px}.key.confirm{background:#16b46b;font-size:8px}.key.hit{background:#fff;color:#151515;box-shadow:0 0 12px #fff,0 0 4px #fff;transform:translateY(2px)}.key.confirm.hit{background:#83ffac;box-shadow:0 0 20px #36ff91}.table{position:absolute;left:-4px;right:-4px;top:618px;height:22px;background:linear-gradient(#e2b886 0%,#c3986b 22%,#a3774f 55%,#563e2b);border-top:3px solid #efc996;box-shadow:0 6px 9px #0009;z-index:5}.table:after{content:"";position:absolute;left:0;right:0;top:19px;height:12px;background:linear-gradient(#7b583b,#4e3526)}.leg{position:absolute;top:646px;height:245px;width:17px;background:linear-gradient(90deg,#151719,#495057 40%,#171a1c);box-shadow:3px 4px 6px #0008;z-index:1}.leg.left{left:15px}.leg.right{right:15px}.rig{position:absolute;width:172px;height:252px;z-index:7;pointer-events:none;transform:translate(-47%,0);transition:left .36s cubic-bezier(.2,.7,.2,1),top .36s cubic-bezier(.2,.7,.2,1),transform .13s;will-change:left,top,transform}.rig img{position:absolute;inset:0;width:172px;height:252px;object-fit:contain;filter:drop-shadow(3px 5px 4px #0005)}.rig.press{transform:translate(-47%,7px) scale(.985)}.rig.idle{opacity:1}.ticker{position:absolute;bottom:28px;left:26px;right:26px;text-align:center;background:#141820ba;border-radius:10px;padding:10px;font-size:12px;font-weight:900;z-index:10}.disclaimer{position:absolute;bottom:8px;width:100%;text-align:center;font-size:9px;color:#e2dfda;font-weight:bold}.flash{animation:flash .4s}@keyframes flash{50%{filter:brightness(1.6)}}

/* V14: transparent extended sleeve asset; no fake rectangles. */

</style></head><body><div id="audioControls"><button id="audioToggle" type="button">🔊 ATIVAR SONS</button><label for="audioVolume">Volume</label><input id="audioVolume" type="range" min="0" max="100" value="55" aria-label="Volume dos efeitos"></div><div class="stage" id="stage"><div class="pill center">ELEIÇÃO 2026</div><div class="logo">✦ URNA LIVE<small>JOGO INTERATIVO</small></div><div class="timer" id="timer">05:00</div><div class="stats"><div><small>TOTAL</small><strong id="total">0</strong></div><div><small>DIFERENÇA</small><strong id="difference">0</strong></div><div><span class="leader" id="leader">EMPATE</span></div></div><div class="cards"><section class="card" id="card22" style="--accent:#299bff;--tint:#1a5b9d"><header>22</header><div class="points" id="points22">0</div><div class="pointslabel">PONTOS</div><div class="bar"><div class="fill" id="fill22"></div></div><div class="counts"><span id="pct22">0%</span><span id="gifts22">0 presentes</span></div></section><section class="card" id="card13" style="--accent:#ff3d52;--tint:#a52737"><header>13</header><div class="points" id="points13">0</div><div class="pointslabel">PONTOS</div><div class="bar"><div class="fill" id="fill13"></div></div><div class="counts"><span id="pct13">0%</span><span id="gifts13">0 presentes</span></div></section></div><div class="gift left">🤍 Rosa branca → 22</div><div class="gift right">🌹 Rosa vermelha → 13</div><div class="machines"><div class="machine" id="machine22"><div class="screen"><img src="assets/candidato-22.png" alt="Foto 22"><div class="typed" id="typed22">22</div><div class="status" id="status22">AGUARDANDO</div></div><div class="keys" data-side="22"></div></div><div class="machine" id="machine13"><div class="screen"><img src="assets/candidato-13.png" alt="Foto 13"><div class="typed" id="typed13">13</div><div class="status" id="status13">AGUARDANDO</div></div><div class="keys" data-side="13"></div></div></div><div class="table"></div><div class="leg left"></div><div class="leg right"></div><div class="rig" id="hand22"><img src="assets/mao-22.png" alt=""></div><div class="rig" id="hand13"><img src="assets/mao-13.png" alt=""></div><div class="ticker" id="ticker">Aguardando presentes...</div><div class="disclaimer"></div></div><script>
// Sons originais sintetizados localmente: sem arquivos externos nem direitos de gravação.
let audioCtx=null,audioEnabled=false,audioVolume=.55;
function enableAudio(){try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();audioEnabled=true;document.getElementById('audioToggle').textContent='🔇 SILENCIAR';document.getElementById('audioControls').classList.add('on')}catch(e){console.warn('Áudio indisponível',e)}}
function sound(type){if(!audioEnabled||!audioCtx||audioCtx.state!=='running')return;
 const now=audioCtx.currentTime;
 function beep(freq,duration,volume=.12,wave='sine',delay=0,endFreq){const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=now+delay;osc.type=wave;osc.frequency.setValueAtTime(freq,t);if(endFreq)osc.frequency.exponentialRampToValueAtTime(endFreq,t+duration);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,volume*audioVolume),t+.007);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.015)}
 if(type==='key'){beep(860,.065,.105,'sine');beep(430,.042,.024,'triangle')}
 if(type==='confirm'){beep(680,.11,.16,'sine');beep(890,.16,.15,'sine',.115);beep(1120,.22,.14,'sine',.29)}
 if(type==='gift'){beep(1120,.08,.075,'sine');beep(1460,.11,.07,'sine',.09)}
 if(type==='lead'){beep(500,.11,.085,'triangle');beep(670,.12,.09,'triangle',.13);beep(850,.20,.09,'triangle',.27)}
 if(type==='tick'){beep(950,.055,.075,'sine')}
 if(type==='end'){beep(650,.22,.12,'triangle');beep(490,.30,.12,'triangle',.23)}
}
document.getElementById('audioToggle').addEventListener('click',()=>{if(audioEnabled){audioEnabled=false;document.getElementById('audioToggle').textContent='🔊 ATIVAR SONS'}else{enableAudio();sound('key')}});
document.getElementById('audioVolume').addEventListener('input',e=>audioVolume=Number(e.target.value)/100);
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));let state={13:0,22:0},seconds=300,running=false,busy=false,epoch=0;const queue=[];function scale(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/540,innerHeight/960))}addEventListener('resize',scale);scale();document.querySelectorAll('.keys').forEach(el=>{for(const n of ['1','2','3','4','5','6','7','8','9','B','0','✓']){let b=document.createElement('button');b.className='key'+(n==='B'?' white':n==='✓'?' confirm':'');b.textContent=n==='B'?'BRANCO':n==='✓'?'✓':n;b.dataset.key=n;el.append(b)}});let previousLeader=0;function update(){let nextLeader=state[13]===state[22]?0:state[13]>state[22]?13:22;if(previousLeader && nextLeader && previousLeader!==nextLeader)sound('lead');previousLeader=nextLeader;let t=state[13]+state[22];$('total').textContent=t;$('difference').textContent=Math.abs(state[13]-state[22]);$('leader').textContent=state[13]===state[22]?'EMPATE':state[13]>state[22]?'13 NA FRENTE':'22 NA FRENTE';$('leader').style.background=state[13]===state[22]?'#56606c':state[13]>state[22]?'#b52b36':'#1675bc';for(const side of [13,22]){$('points'+side).textContent=state[side];$('gifts'+side).textContent=state[side]+' presentes';let p=t?Math.round(state[side]/t*100):0;$('pct'+side).textContent=p+'%';$('fill'+side).style.width=p+'%'}}function moveTo(side,key){const rig=$('hand'+side),r=key.getBoundingClientRect(),s=$('stage').getBoundingClientRect(),scale=s.width/540;rig.style.left=((r.left+r.width/2-s.left)/scale)+'px';rig.style.top=((r.top+r.height*.5-s.top)/scale-4)+'px'}function park(side){let rig=$('hand'+side),machine=$('machine'+side);rig.style.left=(machine.offsetLeft+machine.offsetWidth*.77+machine.parentElement.offsetLeft)+'px';rig.style.top='655px';rig.classList.add('idle')}async function animate(side,token){let rig=$('hand'+side);$('typed'+side).textContent='';$('status'+side).textContent='DIGITANDO';rig.classList.remove('idle');for(const digit of [...String(side),'✓']){if(token!==epoch)return;let key=document.querySelector(`.keys[data-side="${side}"] .key[data-key="${digit}"]`);moveTo(side,key);await sleep(400);if(token!==epoch)return;rig.classList.add('press');key.classList.add('hit');sound(digit==='✓'?'confirm':'key');if(digit!=='✓')$('typed'+side).textContent+=digit;await sleep(220);rig.classList.remove('press');key.classList.remove('hit');await sleep(120)}if(token!==epoch)return;$('typed'+side).textContent='FIM';$('status'+side).textContent='CONFIRMADO ✓';state[side]++;update();$('ticker').textContent=`✓ ${side}: voto fictício confirmado!`;$('card'+side).classList.add('flash');await sleep(550);$('card'+side).classList.remove('flash');park(side);$('status'+side).textContent='AGUARDANDO'}async function process(){if(busy)return;busy=true;while(queue.length){let side=queue.shift();await animate(side,epoch)}busy=false}function vote(side){if(queue.length>250)return;queue.push(Number(side));process()}function reset(){epoch++;queue.length=0;state={13:0,22:0};previousLeader=0;seconds=300;running=false;busy=false;update();$('timer').textContent='05:00';$('ticker').textContent='Aguardando presentes...';for(let side of [13,22]){$('typed'+side).textContent=side;$('status'+side).textContent='AGUARDANDO';park(side)}}function setTimer(){let m=Math.floor(seconds/60),s=seconds%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}setInterval(()=>{if(running&&seconds>0){seconds--;setTimer();if(seconds>0&&seconds<=10)sound('tick');if(seconds===0){sound('end');running=false;$('ticker').textContent='TEMPO ENCERRADO'}}},1000);const channel=new BroadcastChannel('urna-live-v11');channel.onmessage=e=>{let m=e.data;if(m.type==='vote')vote(m.side);if(m.type==='start')running=true;if(m.type==='pause')running=false;if(m.type==='reset')reset();if(m.type==='duration'){seconds=Math.max(1,Math.min(3600,Number(m.seconds)||300));setTimer()}};// Ponte local TikTok LIVE: busca apenas eventos novos, sem duplicar na reconexão.
let giftCursor = 0;
let bridgeReady = false;
async function pollGifts(){
  try {
    const response = await fetch('/api/events?cursor='+giftCursor, {cache:'no-store'});
    if (!response.ok) return;
    const payload = await response.json();
    if (!bridgeReady) { giftCursor = payload.cursor; bridgeReady = true; return; }
    for (const gift of payload.events) {
      if (gift.type !== 'gift' || ![13,22].includes(gift.side)) continue; sound('gift');
      for (let i=0; i<Math.min(gift.count, 250); i++) vote(gift.side);
    }
    giftCursor = payload.cursor;
  } catch(e) { /* modo manual segue disponível */ }
}
setInterval(pollGifts, 600);
pollGifts();
addEventListener('keydown',e=>{if(e.key==='1')vote(22);if(e.key==='2')vote(13);if(e.key===' ')running=!running});update();park(13);park(22);
</script></body></html>
